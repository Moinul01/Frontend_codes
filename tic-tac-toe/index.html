<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic tac toe game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="game-container">
        <div class="title-wrapper">
            <h2 class="title">TIC_TAC_TOE</h2>
        </div>
        <div class="status-box">
            <!-- FIXED: Changed class to id -->
            <div id="statusText">
                Player <span style="color:var(--neon-blue)">X</span>'s turn
            </div>
        </div>
      <div class="scoreboard">
            <div class="score">Player X: <span id="scoreX">0</span></div>
            <div class="score">Draws: <span id="scoreDraw">0</span></div>
            <div class="score">Player O: <span id="scoreO">0</span></div>
        </div>
        <div class="grid" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <button id="resetbtn">reset game</button>
     </div>
     <script src="script.js" defer></script>
</body>
</html>
